services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: local
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    container_name: fastapi-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
